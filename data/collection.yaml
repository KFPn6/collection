# コレクション台帳（正本）
#
# アイテムを追加・更新するときは、このファイルの items に1件ずつ書く。
# あわせて README.md の一覧表も同じ内容に更新する。
#
# 書き方:
# - 日付は YYYY-MM-DD
# - 金額は税込の整数（円）。通貨記号は付けない
# - 不明な項目は null（空欄）。「未確認」とは書かない
# - id は既存の最大値 + 1。変更しない
# - official_url は公式商品ページ、またはカード詳細ページがあるときだけ入れる
# - シングルカードだけ、次のキーを足す。商品では書かない（空欄と同じ）
#   card_name / collector_number / rarity / set_name
# - シングルカードの name は card_name と同じカード名にする
# - シングルカードの release_date は収録パックの発売日。定価がなければ list_price は null
# - category はゲーム名。例: ポケモンカードゲーム、ONE PIECE CARD GAME
# - buyback_shop は売却予定先の店名。buyback_url はその店の当該商品の買取ページ
# - 買取価格は変動するので入れない。入れるときは確認日とセットにする

